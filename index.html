
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>迷雾终局 - 进化版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #000; color: #fff; }

        /* 全局雨滴 */
        .rain-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; opacity: 0.2; }
        .drop { position: absolute; background: #fff; width: 1px; height: 30px; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }

        .container { height: 100%; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .page { height: 100vh; width: 100vw; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; overflow: hidden; }

        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 25px; z-index: 2; width: 90%; max-width: 400px; }

        h2 { font-size: 1.5rem; margin-bottom: 15px; letter-spacing: 2px; color: #efefef; }
        p { font-size: 0.9rem; line-height: 1.6; color: #bbb; }

        /* P1 水雾 */
        #canvas-fog { position: absolute; top: 0; left: 0; z-index: 5; touch-action: none; }

        /* P3 肺部模拟器 */
        .lung-container { position: relative; width: 200px; height: 200px; margin: 20px auto; }
        .lung { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; transition: opacity 0.1s; }
        /* 模拟肺部形状的渐变阴影，实际应用中可替换为仿真图片URL */
        .lung-healthy { 
            background: radial-gradient(circle, #ff7e7e 30%, #ff2e2e 70%); 
            border-radius: 40% 40% 50% 50%; 
            filter: blur(2px) drop-shadow(0 0 15px #ff2e2e);
        }
        .lung-sick { 
            background: radial-gradient(circle, #333 20%, #000 80%); 
            border-radius: 40% 40% 50% 50%; 
            filter: grayscale(1) contrast(1.5);
            opacity: 0;
        }
        .slider { width: 100%; margin-top: 30px; accent-color: #8e44ad; }
        .lung-desc { margin-top: 15px; font-size: 0.85rem; color: #ff7e7e; height: 3em; }

        /* P4 账单与炸裂 */
        .bill-item { display: flex; justify-content: space-between; margin: 10px 0; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        .status-box { margin-top: 20px; padding: 15px; border: 2px solid #ff2e2e; color: #ff2e2e; font-weight: bold; position: relative; cursor: pointer; }
        #canvas-burst { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }

        /* P5 签名 */
        #sig-canvas { background: rgba(0,0,0,0.6); border: 1px dashed #444; margin-top: 15px; touch-action: none; }
        .next-btn { margin-top: 15px; background: transparent; border: 1px solid #8e44ad; color: #8e44ad; padding: 8px 20px; border-radius: 20px; }

    </style>
</head>
<body>

    <div class="rain-overlay" id="rain"></div>
    <canvas id="canvas-burst"></canvas>

    <div class="container" id="main-container">
        <!-- P1: 抹开水雾 -->
        <section class="page" style="background: #050505;">
            <canvas id="canvas-fog"></canvas>
            <div class="glass-card">
                <h2>迷雾终局</h2>
                <p>2026年的雨，比以往更冷一些。<br>在这个被烟雾锁住的城市里，<br>你听，那是谁在喘息？</p>
            </div>
        </section>

        <!-- P2: 被戳穿的诱惑 -->
        <section class="page" style="background: #0a0510;">
            <div class="glass-card">
                <h2 style="color: #bc8cf2;">戳穿“甜蜜”诱惑</h2>
                <div style="width:30px; height:120px; background:linear-gradient(#8e44ad, #000); margin:20px auto; border-radius:5px; box-shadow: 0 0 20px #8e44ad;"></div>
                <p>WHO揭露：尼古丁盐包装下的成瘾陷阱。<br>美丽的外壳，包裹着致命的内核。</p>
            </div>
        </section>

        <!-- P3: 肺部变幻图 (新增交互) -->
        <section class="page" style="background: #0d0d0d;">
            <div class="glass-card">
                <h2>呼吸的代价</h2>
                <div class="lung-container">
                    <div class="lung lung-healthy"></div>
                    <div class="lung lung-sick" id="lungSick"></div>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider" id="lungSlider">
                <div class="lung-desc" id="lungDesc">
                    当前肺部：健康饱满。呈现鲜红色，纤毛运动正常，能够高效过滤氧气。
                </div>
            </div>
        </section>

        <!-- P4: 危害账单 (新增炸裂特效) -->
        <section class="page" style="background: #000;">
            <div class="glass-card">
                <h2>健康赤字账单</h2>
                <div class="bill-item"><span>烟草支出(10年)</span><span>-￥109,500</span></div>
                <div class="bill-item"><span>肺部洗净费用</span><span>-￥350,000</span></div>
                <div class="bill-item"><span>预期寿命减损</span><span>-4,380 天</span></div>
                <div class="status-box" id="statusBox">
                    最终状态：资产破产 / 健康清零
                    <br><span style="font-size: 10px;">(点击此处查看后果)</span>
                </div>
            </div>
        </section>

        <!-- P5: 终局与签名 -->
        <section class="page" style="background: #050505;">
            <div class="glass-card">
                <h2>2026 烟草终局行动</h2>
                <p>请签下你的名字，告别死亡之舞。</p>
                <canvas id="sig-canvas" width="280" height="120"></canvas>
                <button class="next-btn" onclick="alert('承诺成功！')">提交承诺</button>
            </div>
        </section>
    </div>

    <script>
        // 基础翻页逻辑
        let cur = 0;
        let startY = 0;
        const container = document.getElementById('main-container');
        window.addEventListener('touchstart', e => startY = e.touches[0].clientY);
        window.addEventListener('touchend', e => {
            let endY = e.changedTouches[0].clientY;
            if (startY - endY > 60 && cur < 4) cur++;
            if (endY - startY > 60 && cur > 0) cur--;
            container.style.transform = `translateY(-${cur * 100}vh)`;
        });

        // P1: 抹开水雾
        const fog = document.getElementById('canvas-fog');
        const fctx = fog.getContext('2d');
        fog.width = window.innerWidth; fog.height = window.innerHeight;
        fctx.fillStyle = '#222'; fctx.fillRect(0,0,fog.width,fog.height);
        fctx.globalCompositeOperation = 'destination-out';
        const scrub = (e) => {
            const t = e.touches ? e.touches[0] : e;
            fctx.beginPath(); fctx.arc(t.clientX, t.clientY, 40, 0, Math.PI*2); fctx.fill();
        };
        fog.addEventListener('touchmove', scrub);

        // P3: 肺部滑块交互
        const slider = document.getElementById('lungSlider');
        const lungSick = document.getElementById('lungSick');
        const lungDesc = document.getElementById('lungDesc');
        const descs = [
            "健康饱满。呈现鲜红色，纤毛运动正常，能够高效过滤氧气。",
            "轻度污染。肺部开始出现灰斑，呼吸道分泌物增加，咳嗽频率上升。",
            "中度病变。肺组织失去弹性，颜色转暗紫色，肺泡大面积受损。",
            "重度黑化。肺部彻底变黑，布满焦油与肿瘤，呼吸功能近乎衰竭。"
        ];

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            lungSick.style.opacity = val / 100;
            const idx = Math.min(Math.floor(val / 26), 3);
            lungDesc.innerText = descs[idx];
            lungDesc.style.color = `rgb(${255 - val*2}, ${126 - val}, ${126 - val})`;
        });

        // P4: 炸裂特效
        const canvasBurst = document.getElementById('canvas-burst');
        const bctx = canvasBurst.getContext('2d');
        canvasBurst.width = window.innerWidth;
        canvasBurst.height = window.innerHeight;
        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.color = Math.random() > 0.5 ? '#ff2e2e' : '#fff';
                this.life = 1.0;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.life -= 0.02; }
            draw() {
                bctx.globalAlpha = this.life;
                bctx.fillStyle = this.color;
                bctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        document.getElementById('statusBox').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            for(let i=0; i<50; i++) particles.push(new Particle(rect.left + rect.width/2, rect.top + rect.height/2));
            animateBurst();
        });

        function animateBurst() {
            bctx.clearRect(0,0,canvasBurst.width, canvasBurst.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            if(particles.length > 0) requestAnimationFrame(animateBurst);
        }

        // 雨滴生成
        const rain = document.getElementById('rain');
        for (let i = 0; i < 40; i++) {
            const d = document.createElement('div');
            d.className = 'drop'; d.style.left = Math.random()*100+'vw';
            d.style.animationDuration = (Math.random()*0.5+0.5)+'s';
            d.style.animationDelay = Math.random()*2+'s';
            rain.appendChild(d);
        }
    </script>
</body>
</html>
