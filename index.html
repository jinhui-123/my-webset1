<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>迷雾终局 - 拒绝诱惑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        
        .container { height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .page { height: 100vh; width: 100vw; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; width: 85%; text-align: center; z-index: 5; }

        /* P1 擦除 */
        #fog { position: absolute; top: 0; left: 0; z-index: 10; touch-action: none; }
        #btn-p1 { display: none; margin-top: 20px; padding: 12px 30px; background: #8e44ad; border: none; color: #fff; border-radius: 25px; }

        /* P2 小游戏 */
        .bubble { position: absolute; background: rgba(142, 68, 173, 0.6); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; cursor: pointer; animation: float 4s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        #score-board { margin-bottom: 10px; color: #8e44ad; font-weight: bold; }

        /* P3 肺部 */
        .lung-wrap { position: relative; width: 160px; height: 160px; margin: 20px auto; }
        .lung { position: absolute; inset: 0; border-radius: 40% 40% 50% 50%; filter: blur(2px); }
        .lung-h { background: radial-gradient(circle, #ff7e7e, #ff2e2e); }
        .lung-s { background: #000; opacity: 0; }
        input[type=range] { width: 100%; margin: 20px 0; accent-color: #8e44ad; }

        /* P4 小票 */
        .machine { width: 180px; height: 10px; background: #333; margin: 0 auto; border-radius: 5px 5px 0 0; }
        #receipt { width: 160px; background: #eee; color: #000; margin: 0 auto; overflow: hidden; height: 0; transition: height 0.3s; font-family: monospace; font-size: 12px; }
        .line { border-bottom: 1px dashed #999; padding: 8px 5px; display: flex; justify-content: space-between; }
        .btn-red { background: #ff2e2e; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; margin-top: 15px; }

        /* P5 签名 */
        #canvas { background: rgba(255,255,255,0.1); border: 1px dashed #444; border-radius: 10px; margin: 15px 0; touch-action: none; }
        
        /* 炸裂特效 */
        #burst { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>

<canvas id="burst"></canvas>

<div class="container" id="main">
    <section class="page">
        <canvas id="fog"></canvas>
        <div class="card">
            <h2>迷雾终局</h2>
            <p>真相被掩盖在水雾之下<br>请亲手抹去伪装</p >
            <button id="btn-p1" onclick="next(1)">点击前往真相</button>
        </div>
    </section>

    <section class="page" id="game-page">
        <div class="card">
            <h2>击碎谎言</h2>
            <div id="score-board">已击碎: 0 / 10</div>
            <p style="font-size: 13px;">点击消除飘浮的“社交糖衣”</p >
        </div>
        </section>

    <section class="page">
        <div class="card">
            <h2 style="color:#ff2e2e">吸烟的代价</h2>
            <div class="lung-wrap">
                <div class="lung lung-h"></div>
                <div class="lung lung-s" id="lung-s"></div>
            </div>
            <input type="range" id="lung-range" min="0" max="100" value="0">
            <p id="lung-text" style="font-size: 12px; height: 36px;">当前：健康饱满。肺部呈现鲜红色，呼吸功能极佳。</p >
            <button onclick="next(3)" style="background:none; border:1px solid #444; color:#666; margin-top:10px; padding:5px 10px;">查看账单</button>
        </div>
    </section>

    <section class="page">
        <div class="card">
            <h2>健康透支账单</h2>
            <div class="machine"></div>
            <div id="receipt">
                <div class="line"><span>项目</span><span>金额/代价</span></div>
            </div>
            <button class="btn-red" id="print-btn" onclick="printLine()">打印账单</button>
            <button id="p4-next" style="display:none; border:1px solid #8e44ad; background:none; color:#8e44ad; padding:10px; margin-top:10px;" onclick="next(4)">最后一步</button>
        </div>
    </section>

    <section class="page">
        <div class="card">
            <h2>无烟承诺</h2>
            <p>在此签下你的名字，重塑新生</p >
            <canvas id="canvas" width="280" height="150"></canvas>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button onclick="clearCanvas()" style="padding:8px 15px; background:#444; border:none; color:#fff;">重写</button>
                <button onclick="alert('承诺成功！')" style="padding:8px 15px; background:#8e44ad; border:none; color:#fff;">提交</button>
            </div>
        </div>
    </section>
</div>

<script>
    let current = 0;
    const main = document.getElementById('main');
    function next(n) { current = n; main.style.transform = `translateY(-${n*100}vh)`; if(n===1) initGame(); }

    // P1 擦除
    const fog = document.getElementById('fog');
    const fctx = fog.getContext('2d');
    fog.width = innerWidth; fog.height = innerHeight;
    fctx.fillStyle = '#222'; fctx.fillRect(0,0,innerWidth,innerHeight);
    fctx.globalCompositeOperation = 'destination-out';
    fog.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        fctx.beginPath(); fctx.arc(t.clientX, t.clientY, 40, 0, Math.PI*2); fctx.fill();
        document.getElementById('btn-p1').style.display = 'block';
    });

    // P2 小游戏逻辑
    let score = 0;
    const lies = ["减压", "时尚", "提神", "无害", "社交", "最后一口", "不粘人", "纯净"];
    function initGame() {
        if(document.querySelectorAll('.bubble').length > 0) return;
        for(let i=0; i<8; i++) createBubble();
    }
    function createBubble() {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 60 + Math.random()*20;
        b.style.width = b.style.height = size + 'px';
        b.style.left = Math.random()*(innerWidth-80) + 'px';
        b.style.top = Math.random()*(innerHeight-150) + 100 + 'px';
        b.innerText = lies[Math.floor(Math.random()*lies.length)];
        b.onclick = () => {
            b.style.transform = 'scale(0)';
            setTimeout(() => b.remove(), 200);
            score++;
            document.getElementById('score-board').innerText = `已击碎: ${score} / 10`;
            if(score >= 10) setTimeout(() => next(2), 500);
            else createBubble();
        };
        document.getElementById('game-page').appendChild(b);
    }

    // P3 肺部变化
    const lungRange = document.getElementById('lung-range');
    const lungS = document.getElementById('lung-s');
    const lungText = document.getElementById('lung-text');
    const lungDescs = [
        "当前：健康饱满。肺部鲜红色，呼吸功能极佳。",
        "1-3年：开始沉积焦油，纤毛受损，咳嗽增加。",
        "5-8年：肺部颜色转暗，呼吸开始感到费力。",
        "10年以上：黑化严重，充满致癌物质，生命垂竭。"
    ];
    lungRange.oninput = (e) => {
        const v = e.target.value;
        lungS.style.opacity = v / 100;
        lungText.innerText = lungDescs[Math.floor(v/26)];
        lungText.style.color = `rgb(255, ${255-v*2}, ${255-v*2})`;
    };

    // P4 打印小票
    let lineIdx = 0;
    const bill = [
        {k:"十年购烟款", v:"-12.8万"},
        {k:"肺部清理费", v:"-35.0万"},
        {k:"寿命减损", v:"-2500天"},
        {k:"健康状态", v:"清零"}
    ];
    function printLine() {
        if(lineIdx >= bill.length) return;
        const res = document.getElementById('receipt');
        const l = document.createElement('div');
        l.className = 'line';
        l.innerHTML = `<span>${bill[lineIdx].k}</span><span>${bill[lineIdx].v}</span>`;
        res.appendChild(l);
        res.style.height = (lineIdx + 2) * 35 + 'px';
        if(bill[lineIdx].v === "清零") {
            startBurst();
            document.getElementById('print-btn').style.display = 'none';
            document.getElementById('p4-next').style.display = 'block';
        }
        lineIdx++;
    }

    // 炸裂效果
    const bCanvas = document.getElementById('burst');
    const bctx = bCanvas.getContext('2d');
    let particles = [];
    function startBurst() {
        bCanvas.width = innerWidth; bCanvas.height = innerHeight;
        for(let i=0; i<80; i++) particles.push({x:innerWidth/2, y:innerHeight/2, vx:Math.random()*15-7.5, vy:Math.random()*15-7.5, r:3, l:1});
        function draw() {
            bctx.clearRect(0,0,innerWidth,innerHeight);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.l -= 0.02;
                bctx.fillStyle = `rgba(255,46,46,${p.l})`;
                bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, Math.PI*2); bctx.fill();
            });
            particles = particles.filter(p => p.l > 0);
            if(particles.length) requestAnimationFrame(draw);
        }
        draw();
    }

    // P5 签名
    const canvas = document.getElementById('canvas');
    const sctx = canvas.getContext('2d');
    sctx.strokeStyle = "#fff"; sctx.lineWidth = 3;
    let drawing = false;
    const getPos = (e) => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    canvas.addEventListener('touchstart', (e) => { 
        drawing = true; const p = getPos(e); sctx.beginPath(); sctx.moveTo(p.x, p.y); 
        e.preventDefault();
    });
    canvas.addEventListener('touchmove', (e) => { 
        if(!drawing) return; const p = getPos(e); sctx.lineTo(p.x, p.y); sctx.stroke(); 
        e.preventDefault();
    });
    canvas.addEventListener('touchend', () => drawing = false);
    function clearCanvas() { sctx.clearRect(0,0,280,150); }
</script>

</body>
</html>
